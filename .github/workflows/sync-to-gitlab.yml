name: Sync to GitLab
# GitHub is the source of truth for the portfolio. Every push to main is
# mirrored to the GitLab repo, whose Pages pipeline deploys sh20raj.gitlab.io.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/SH20RAJ/sh20raj.gitlab.io.git"
          git push --force gitlab HEAD:main
